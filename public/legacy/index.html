<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dynamic Multi-Stream Mixer</title>
        <style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #121212;
    color: #e0e0e0;
    margin: 0;
    padding: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
}
        .mixer-board {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 6px 30px rgba(0,0,0,0.6);
            max-width: 750px;
            width: 100%;
        }
        h1 { margin-top: 0; font-size: 1.6rem; text-align: center; color: #fff; }

        .global-section {
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            border-left: 4px solid #1db954;
        }
        .global-ctrls { display: flex; gap: 10px; }

        .add-video-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        input[type="text"] {
            flex: 1;
            background: #2b2b2b;
            border: 1px solid #444;
            padding: 12px;
            border-radius: 6px;
            color: #fff;
            font-size: 0.9rem;
        }

        .channels-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .channel-strip {
            background: #282828;
            padding: 15px;
            border-radius: 8px;
            display: grid;
            grid-template-columns: 1fr 180px 80px 80px;
            align-items: center;
            gap: 15px;
            border: 1px solid #333;
        }
        .track-info {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .track-title { font-weight: bold; font-size: 0.95rem; color: #fff; display: block; margin-bottom: 4px; }
        .track-id { font-size: 0.75rem; color: #888; }

        .volume-flex { display: flex; align-items: center; gap: 8px; }
        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            background: #444;
            height: 6px;
            border-radius: 3px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #1db954;
            cursor: pointer;
        }

        button {
            padding: 10px 18px;
            font-weight: bold;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            font-size: 0.85rem;
        }
        button:active { transform: scale(0.96); }
        .btn-primary { background: #1db954; color: #fff; }
        .btn-primary:hover { background: #1ed760; }
        .btn-secondary { background: #444; color: #ddd; }
        .btn-secondary:hover { background: #555; }
        .btn-danger { background: #b71c1c; color: #fff; }
        .btn-danger:hover { background: #d32f2f; }
        .btn-mute { background: #388e3c; color: #fff; }
        .btn-mute.muted { background: #e53935; }

        /* Actual functional hidden containers used by YouTube's framework engine */
        #video-storage { display: none; }
        </style>
    </head>
    <body>

        <div class="mixer-board">
            <h1>Multi-Feed Soundboard</h1>

            <!-- Global Framework Level Control Structure -->
            <div class="global-section">
                <div>
                    <span style="font-weight: bold; display: block;">Master Gain Console</span>
                    <span style="font-size:0.75rem; color:#aaa;">Fixes modern browser autoplay blockades</span>
                </div>
                <div class="volume-flex" style="width: 220px;">
                    <span style="font-size:0.8rem;">🔊</span>
                    <input type="range" id="globalVolume" min="0" max="100" value="80" oninput="updateMasterVolume()">
                    <span id="globalVolLabel" style="font-size:0.8rem; width:30px;">80%</span>
                </div>
                <div class="global-ctrls">
                    <button class="btn-primary" onclick="globalPlayAll()">Play All</button>
                    <button class="btn-secondary" onclick="globalPauseAll()">Pause All</button>
                </div>
            </div>

            <!-- Feed Insertion Interface -->
            <div class="add-video-bar">
                <input type="text" id="videoUrlInput" placeholder="Paste YouTube Video URL or ID (e.g., https://youtube.com)">
                <button class="btn-primary" onclick="addNewChannel()">Add Feed</button>
            </div>

            <!-- Track Channels Dynamic Output Grid -->
            <div class="channels-container" id="channelsContainer"></div>
        </div>

        <!-- Underlying Target Injection Points for Node Mapping -->
        <div id="video-storage"></div>

        <script>
            // Injected system tracks arrays
            let channels = [
                { id: "ch_1", videoId: "1nZh1ILveC4", label: "Lo-Fi Deep House (Radio Ep. 27)", volume: 70, muted: false, player: null },
                { id: "ch_2", videoId: "-dT6bN3hZFQ", label: "10Hz Alpha Waves Binaural Noise", volume: 40, muted: false, player: null }
            ];

            let masterVolume = 80;

            // Async engine injection for cross-origin postMessage processing
            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            const firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

            function onYouTubeIframeAPIReady() {
                // Build initial workspace loop
                channels.forEach(ch => initYouTubePlayer(ch));
                renderMixerStrips();
            }

            function initYouTubePlayer(ch) {
                // Create hidden element dynamically to safely link instances
                const container = document.getElementById('video-storage');
                const playerDiv = document.createElement('div');
                playerDiv.id = `iframe_${ch.id}`;
                container.appendChild(playerDiv);

                ch.player = new YT.Player(playerDiv.id, {
                    height: '200',
                    width: '200',
                    videoId: ch.videoId,
                    playerVars: { 'autoplay': 0, 'controls': 0, 'loop': 1, 'playlist': ch.videoId },
                    events: {
                        'onReady': (e) => {
                            syncChannelVolume(ch);
                        }
                    }
                });
            }

            function renderMixerStrips() {
                const container = document.getElementById('channelsContainer');
                container.innerHTML = '';

                if(channels.length === 0) {
                    container.innerHTML = `<div style="text-align:center; color:#666; padding: 20px;">No feeds tracking. Add a YouTube URL above.</div>`;
                    return;
                }

                channels.forEach(ch => {
                    const strip = document.createElement('div');
                    strip.className = 'channel-strip';
                    strip.innerHTML = `
                <div class="track-info">
                    <span class="track-title">${ch.label}</span>
                    <span class="track-id">Source Node ID: ${ch.videoId}</span>
                </div>
                <div class="volume-flex">
                    <span>🎛️</span>
                    <input type="range" min="0" max="100" value="${ch.volume}" oninput="handleTrackVolumeChange('${ch.id}', this.value)">
                    <span style="font-size:0.8rem; width:30px;">${ch.volume}%</span>
                </div>
                <button class="btn-mute ${ch.muted ? 'muted' : ''}" onclick="toggleTrackMute('${ch.id}')">
                    ${ch.muted ? 'Muted' : 'Mute'}
                </button>
                <button class="btn-danger" onclick="removeChannel('${ch.id}')">Remove</button>
            `;
                    container.appendChild(strip);
                });
            }

            // Mathematical formula routing mapping specific tracking limits 
            function syncChannelVolume(ch) {
                if (!ch.player || typeof ch.player.setVolume !== 'function') return;

                if (ch.muted) {
                    ch.player.setVolume(0);
                } else {
                    // Evaluates local slider track weight balanced by general master limits
                    const calculatedTarget = Math.round((ch.volume / 100) * (masterVolume / 100) * 100);
                    ch.player.setVolume(calculatedTarget);
                }
            }

            function handleTrackVolumeChange(id, val) {
                const ch = channels.find(c => c.id === id);
                if (ch) {
                    ch.volume = parseInt(val);
                    syncChannelVolume(ch);
                    renderMixerStrips();
                }
            }

            function toggleTrackMute(id) {
                const ch = channels.find(c => c.id === id);
                if (ch) {
                    ch.muted = !ch.muted;
                    syncChannelVolume(ch);
                    renderMixerStrips();
                }
            }

            function updateMasterVolume() {
                masterVolume = parseInt(document.getElementById('globalVolume').value);
                document.getElementById('globalVolLabel').innerText = `${masterVolume}%`;
                channels.forEach(ch => syncChannelVolume(ch));
            }

            function globalPlayAll() {
                channels.forEach(ch => {
                    if (ch.player && typeof ch.player.playVideo === 'function') {
                        ch.player.playVideo();
                        syncChannelVolume(ch); // Re-enforce audio level synchronization post browser-unlock
                    }
                });
            }

            function globalPauseAll() {
                channels.forEach(ch => {
                    if (ch.player && typeof ch.player.pauseVideo === 'function') {
                        ch.player.pauseVideo();
                    }
                });
            }

            function addNewChannel() {
                const input = document.getElementById('videoUrlInput');
                let rawValue = input.value.trim();
                if(!rawValue) return;
                // Extracts YouTube unique string parameters cleanly
                let videoId = rawValue;
                if(rawValue.includes('v=')) {
                    videoId = rawValue.split('v=')[1].split('&')[0];
                } else if (rawValue.includes('youtu.be/')) {
                    videoId = rawValue.split('youtu.be/')[1].split('?')[0];
                }
                const uniqueId = 'ch_' + Date.now();
                const newTrack = {
                    id: uniqueId,
                    videoId: videoId,
                    label: "Custom Added Video Feed",
                    volume: 50,
                    muted: false,
                    player: null
                };
                channels.push(newTrack);
                initYouTubePlayer(newTrack);
                renderMixerStrips();
                input.value = '';
            }
            function removeChannel(id) {
                const index = channels.findIndex(c => c.id === id);
                if(index !== -1) {
                    const ch = channels[index];
                    if(ch.player && typeof ch.player.destroy === 'function') {
                        ch.player.destroy(); // Safely clear embedded window memory Allocation
                    }
                    channels.splice(index, 1);
                    renderMixerStrips();
                }
            }
        </script>
</html>
